# Level 1 (spec §7): identity and recovery. Teacher of both tasks = checkpoint-60000; student = a perturbed copy of it.
# Data: 20 episodes per task from checkpoint-60000 itself (round 0 only, no teacher episodes, no further rounds).
# Run: flock -w 7200 <gpu.lock> conda run --no-capture-output -n a2u-policy python -m distillation.gr00t.rounds \
#        --config configs/distillation/level1_recovery.yaml
# null = placeholder; rounds.py refuses to start until every null is set.
run_id: level1_recovery
level: level1
pairing: pnp_cabinet_drawer
roles: [i1, i2]
checkpoints:            # policy label -> checkpoint dir (project-relative); labels also name the shared collections
  ckpt60k: checkpoints/sft_joint/gr00t_n1-5/foundation_model_learning/target_posttraining/atomic_seen/checkpoint-60000
student:
  init: ckpt60k
  perturb_scale: 0.2    # calibration (I1, seeds 1000-1009, 10 eps): 0 6/10, 0.02 4, 0.05 4, 0.1 6, 0.2 3, 0.3 4, 0.5 0
  perturb_seed: 0
teachers: {i1: ckpt60k, i2: ckpt60k}   # role -> teacher label (router: task id 1, 2)
collection:
  policy: ckpt60k       # data policy of round 0; later rounds collect with the previous round's student
  student_episodes: 20  # per role and round: episodes 0..19, seeds 200000 + round*1000 + episode
  teacher_episodes: 0   # per role, round 0 only, episodes 20..39 (0 = none)
distill:                # distillation/toy/RESULTS.md recommended settings
  alpha_dmd: 0.5
  alpha_fm: 0.5
  k_fake: 5
  lambda_ida: 0.99
  num_flow_steps: 4
train:
  lr: 1.0e-5
  batch_size: 16        # Phase C test 7: largest with >= 15% headroom (peak 74.1 GiB nvidia-smi; 2.1 s per update)
  steps_per_round: 2000 # maximum (spec §7); stops earlier when the offline distance stops improving
  eval_every: 100       # offline distance every N updates (and before the first)
  patience: 3           # stop after N evaluations without a new best (0 = never)
  holdout: 200          # round-0 observations held out for the offline distance (0 = none)
  holdout_seed: 0
  seed: 0
max_rounds: 1
selection:
  num_episodes: 20      # seeds seed_start .. seed_start + 19, inside 1000-1019
  seed_start: 1000
  reference_policies: [ckpt60k]   # also evaluated on every role (shared results): the recovery target
  extra_roles: []       # roles evaluated only for the initial and the best student
